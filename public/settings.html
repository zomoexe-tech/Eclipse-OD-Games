<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Eclipse Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <!-- Toast -->
  <div id="toast"></div>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1>QUANTUM <span>V4</span></h1>
      </header>
      <div class="quantum-body">
        <aside class="sidebar"></aside>
        <main class="quantum-panel">
          <div class="games-container main-content" style="padding-top:20px;">
            <div class="games-title-corner"><h1>Settings</h1></div>
            
            <div class="settings-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start; margin-top: 20px;">
              <!-- Animations Card -->
              <div class="settings-card">
                <div class="settings-card-header"><div class="settings-card-title">Animations</div></div>
                <p class="settings-card-desc">Enable smooth page transitions and hover effects.</p>
                <div class="settings-toggle">
                  <span id="animLabel">Enabled</span>
                  <label class="toggle-switch">
                    <input type="checkbox" id="animToggle" checked onchange="saveAnimations()">
                    <span class="slider"></span>
                  </label>
                </div>
              </div>

              <!-- Particles Card -->
              <div class="settings-card">
                <div class="settings-card-header"><div class="settings-card-title">Particles</div></div>
                <p class="settings-card-desc">Choose a dynamic background effect.</p>
                <select id="particleSelect" class="settings-select" onchange="saveParticle()">
                  <option value="rain">Digital Rain</option>
                  <option value="stars">Starfield</option>
                  <option value="snow">Snow</option>
                  <option value="bubbles">Bubbles</option>
                  <option value="embers">Embers</option>
                  <option value="none">None</option>
                </select>
                <div class="settings-actions" style="margin-top:14px;">
                  <button class="s-btn accent" onclick="saveParticle()">Apply Background</button>
                </div>
              </div>

              <!-- Theme Card -->
              <div class="settings-card" style="grid-column: 1 / -1; max-width: 660px; justify-self: center;">
                <div class="settings-card-header"><div class="settings-card-title">Theme Layout</div></div>
                <p class="settings-card-desc">Choose a color theme for the entire site.</p>
                <div style="display:flex; gap:15px; flex-wrap:wrap;">
                  <div style="flex:1; min-width:200px;">
                    <label style="font-size:13px;color:#9ca3af;display:block;margin-bottom:4px;">Base Theme:</label>
                    <select id="themeSelect" class="settings-select">
                      <option value="theme-bw">Black &amp; White</option>
                      <option value="theme-dark">Dark Original</option>
                      <option value="theme-neon">Neon</option>
                      <option value="theme-sunset">Sunset</option>
                      <option value="theme-ocean">Ocean</option>
                      <option value="theme-forest">Forest</option>
                    </select>
                  </div>
                  <div style="flex:1; min-width:200px;">
                    <label style="font-size:13px;color:#9ca3af;display:block;margin-bottom:4px;">Accent color:</label>
                    <select id="colorSelect" class="settings-select">
                      <option value="">Default</option>
                      <option value="red">Red</option>
                      <option value="blue">Blue</option>
                      <option value="green">Green</option>
                      <option value="purple">Purple</option>
                      <option value="orange">Orange</option>
                      <option value="pink">Pink</option>
                      <option value="cyan">Cyan</option>
                      <option value="yellow">Yellow</option>
                    </select>
                  </div>
                </div>
                <div class="settings-actions" style="margin-top:20px;">
                  <button class="s-btn accent" onclick="applyTheme()">Apply Theme</button>
                  <button class="s-btn danger" onclick="resetTheme()">Reset</button>
                </div>
              </div>

              <!-- Tab Cloaker Card -->
              <div class="settings-card">
                <div class="settings-card-header"><div class="settings-card-title">Tab Cloaker</div></div>
                <p class="settings-card-desc">Hide the site by changing the tab name and icon to look like school work.</p>
                <select id="cloakSelect" class="settings-select" onchange="saveCloak()">
                  <option value="off">Off (Default)</option>
                  <option value="google">Google</option>
                  <option value="drive">Google Drive</option>
                  <option value="docs">Google Docs</option>
                  <option value="slides">Google Slides</option>
                  <option value="canvas">Canvas</option>
                  <option value="schoology">Schoology</option>
                </select>
                <div class="settings-actions" style="margin-top:14px;">
                  <button class="s-btn accent" onclick="saveCloak()">Apply Cloak</button>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    const animToggle = document.getElementById('animToggle');
    const animLabel = document.getElementById('animLabel');
    animToggle.checked = settings.animationEnabled;
    animLabel.textContent = settings.animationEnabled ? 'Enabled' : 'Disabled';
    document.getElementById('themeSelect').value = settings.theme;
    document.getElementById('colorSelect').value = localStorage.getItem('selectedColor') || '';
    document.getElementById('particleSelect').value = settings.particleType;
    document.getElementById('cloakSelect').value = localStorage.getItem('tabCloak') || 'off';

    function openInAboutBlank() {
      const win = window.open();
      if (!win) return alert('Popup blocked!');
      const url = window.location.href.split('/').slice(0, -1).join('/') + '/index.html';
      win.document.body.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:none;position:fixed;top:0;left:0;"></iframe>`;
      win.document.body.style.margin = '0';
    }

    function saveAnimations() {
      localStorage.setItem('animationEnabled', animToggle.checked);
      location.reload();
    }

    function saveParticle() {
      localStorage.setItem('particleType', document.getElementById('particleSelect').value);
      location.reload();
    }

    function applyTheme() {
      localStorage.setItem('theme', document.getElementById('themeSelect').value);
      localStorage.setItem('selectedColor', document.getElementById('colorSelect').value);
      location.reload();
    }

    function resetTheme() {
      localStorage.clear();
      location.reload();
    }

    function saveCloak() {
      const cloak = document.getElementById('cloakSelect').value;
      localStorage.setItem('tabCloak', cloak);
      applyTabCloak(); // Re-apply immediately
    }
  </script>

</body>

</html>
