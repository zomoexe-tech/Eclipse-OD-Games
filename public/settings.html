<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Eclipse Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <!-- Toast -->
  <div id="toast"></div>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1><span>V4</span> QUANTUM</h1>
      </header>
      <div class="quantum-body">
        <aside class="sidebar"></aside>
        <main class="quantum-panel">
          <div class="settings-page-container main-content">
    <h1 class="settings-page-title">Settings</h1>
    <div class="settings-card">
      <div class="settings-card-header"><div class="settings-card-title">Blanker</div></div>
      <p class="settings-card-desc">Opens the site inside an <code style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;font-size:12px;">about:blank</code> popup window.</p>
      <div class="settings-actions"><button class="s-btn accent" onclick="openInAboutBlank()">Open Blank Tab</button></div>
    </div>
    <div class="settings-card">
      <div class="settings-card-header"><div class="settings-card-title">Animations</div></div>
      <p class="settings-card-desc">Turn off all particle effects for better performance.</p>
      <div class="toggle-row">
        <label class="toggle-switch"><input type="checkbox" id="animToggle" onchange="saveAnimations()"><span class="toggle-slider"></span></label>
        <span class="toggle-label" id="animLabel">Enabled</span>
      </div>
    </div>
    <div class="settings-card">
      <div class="settings-card-header"><div class="settings-card-title">Background Changer</div></div>
      <p class="settings-card-desc">Choose a particle effect for the background.</p>
      <select id="particleSelect" class="settings-select">
        <option value="snow">Snow</option>
        <option value="stars">Stars</option>
        <option value="rain">Rain</option>
        <option value="bubbles">Bubbles</option>
        <option value="embers">Embers</option>
        <option value="matrix">Matrix</option>
        <option value="grid">Grid</option>
        <option value="none">None</option>
      </select>
      <div class="settings-actions" style="margin-top:14px;"><button class="s-btn accent" onclick="saveParticle()">Apply Background</button></div>
    </div>
    <div class="settings-card">
      <div class="settings-card-header"><div class="settings-card-title">Theme</div></div>
      <p class="settings-card-desc">Choose a color theme for the entire site.</p>
      <select id="themeSelect" class="settings-select">
        <option value="theme-bw">Black &amp; White</option>
        <option value="theme-dark">Dark Original</option>
        <option value="theme-neon">Neon</option>
        <option value="theme-sunset">Sunset</option>
        <option value="theme-ocean">Ocean</option>
        <option value="theme-forest">Forest</option>
      </select>
      <label style="font-size:13px;color:#9ca3af;display:block;margin-bottom:4px;margin-top:14px;">Accent color:</label>
      <select id="colorSelect" class="settings-select">
        <option value="">Default</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
        <option value="purple">Purple</option>
        <option value="orange">Orange</option>
        <option value="pink">Pink</option>
        <option value="cyan">Cyan</option>
        <option value="yellow">Yellow</option>
      </select>
      <div class="settings-actions">
        <button class="s-btn accent" onclick="applyTheme()">Apply Theme</button>
        <button class="s-btn danger" onclick="resetTheme()">Reset</button>
      </div>
    </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    const animToggle = document.getElementById('animToggle');
    const animLabel = document.getElementById('animLabel');
    animToggle.checked = settings.animationEnabled;
    animLabel.textContent = settings.animationEnabled ? 'Enabled' : 'Disabled';
    document.getElementById('themeSelect').value = settings.theme;
    document.getElementById('colorSelect').value = localStorage.getItem('selectedColor') || '';
    document.getElementById('particleSelect').value = settings.particleType;

    function openInAboutBlank() {
      const win = window.open();
      if (!win) return alert('Popup blocked!');
      const url = window.location.href.split('/').slice(0, -1).join('/') + '/index.html';
      win.document.body.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:none;position:fixed;top:0;left:0;"></iframe>`;
      win.document.body.style.margin = '0';
    }

    function saveAnimations() {
      localStorage.setItem('animationEnabled', animToggle.checked);
      location.reload();
    }

    function saveParticle() {
      localStorage.setItem('particleType', document.getElementById('particleSelect').value);
      location.reload();
    }

    function applyTheme() {
      localStorage.setItem('theme', document.getElementById('themeSelect').value);
      localStorage.setItem('selectedColor', document.getElementById('colorSelect').value);
      location.reload();
    }

    function resetTheme() {
      localStorage.clear();
      location.reload();
    }
  </script>

</body>

</html>
