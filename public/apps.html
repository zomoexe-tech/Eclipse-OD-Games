<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apps — Eclipse Games</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    /* Apps-specific: icon grid style */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 18px;
      width: 100%;
    }
    .app-card {
      background: rgba(27, 27, 27, 0.7);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s ease;
    }
    .app-card:hover {
      border-color: rgba(255,255,255,0.3);
      transform: translateY(-4px);
      background: rgba(43, 43, 46, 0.8);
    }
    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: #2b2b2e;
    }
    .app-name {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      color: #fff;
      line-height: 1.3;
    }
    .app-card-error {
      opacity: 0.45;
    }
  </style>
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1>QUANTUM <span>V4</span></h1>
      </header>
      <div class="quantum-body">
        <aside class="sidebar"></aside>
        <main class="quantum-panel">
          <div class="games-container main-content">
            <div class="games-title-corner"><h1>Apps</h1></div>
            <div class="search-container">
              <input type="text" id="searchInput" class="search-input" placeholder="Search apps...">
            </div>
            <div class="games-panel">
              <div class="apps-grid" id="appsGrid"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- App Panel Overlay -->
  <div class="game-panel-overlay" id="gamePanelOverlay"></div>
  <div class="game-panel" id="gamePanel">
    <div class="game-panel-content">
      <div class="game-panel-loader" id="gamePanelLoader">
        <div class="loader" style="border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ffffff;"></div>
        <div style="color: #ffffff; font-size: 14px; margin-top: 16px; font-family: 'Arial Black', Impact; text-transform: uppercase; letter-spacing: 2px;">Loading...</div>
      </div>
      <iframe id="gameFrame" src=""
        allow="autoplay *; fullscreen *; accelerometer *; camera *; gyroscope *; magnetometer *; microphone *; usb *; xr-spatial-tracking *"></iframe>
    </div>
    <div class="game-panel-header">
      <h2 class="game-panel-title" id="gamePanelTitle">App</h2>
      <div class="game-actions">
        <button class="game-panel-fullscreen" id="gamePanelFullscreen" title="Toggle Fullscreen">⛶</button>
        <button class="game-panel-close" id="gamePanelClose" title="Close">&times;</button>
      </div>
    </div>
  </div>

  <script src="assets/js/apps.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function loadApps(filter = '') {
      const grid = document.getElementById('appsGrid');
      grid.innerHTML = '';

      for (const app of apps) {
        if (filter && !app.name.toLowerCase().includes(filter.toLowerCase())) continue;

        const card = document.createElement('div');
        card.className = 'app-card';

        const img = document.createElement('img');
        img.className = 'app-icon';
        img.src = app.icon;
        img.alt = app.name;
        img.onerror = function() { this.src = 'assets/appicons/custom.webp'; };

        const name = document.createElement('div');
        name.className = 'app-name';
        name.textContent = app.name;

        card.appendChild(img);
        card.appendChild(name);

        card.addEventListener('click', () => {
          if (app.blank) {
            window.open(app.url, '_blank');
          } else {
            openAppPanel(app.name, app.url);
          }
        });

        grid.appendChild(card);
      }
    }

    function openAppPanel(name, url) {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const title = document.getElementById('gamePanelTitle');
      const frame = document.getElementById('gameFrame');
      const loader = document.getElementById('gamePanelLoader');

      title.textContent = name;
      loader.classList.remove('hidden');
      frame.src = url;
      frame.onload = () => setTimeout(() => loader.classList.add('hidden'), 200);

      panel.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closePanel() {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const frame = document.getElementById('gameFrame');
      panel.classList.remove('active');
      overlay.classList.remove('active');
      frame.src = '';
      document.body.style.overflow = 'auto';
    }

    document.getElementById('searchInput').addEventListener('input', e => loadApps(e.target.value));
    document.getElementById('gamePanelClose').addEventListener('click', closePanel);
    document.getElementById('gamePanelOverlay').addEventListener('click', closePanel);
    document.getElementById('gamePanelFullscreen').addEventListener('click', () => {
      const f = document.getElementById('gameFrame');
      if (!document.fullscreenElement) f.requestFullscreen();
      else document.exitFullscreen();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

    loadApps();
  </script>
</body>

</html>
