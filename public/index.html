<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>

  <canvas id="bgCanvas"></canvas>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1>QUANTUM <span>V4</span></h1>
      </header>

      <div class="quantum-body">
        <aside class="sidebar">
          <!-- Injected by main.js -->
        </aside>

        <main class="quantum-panel">
          <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; padding: 20px;">
            <div style="background: rgba(27, 27, 27, 0.7); backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 60px 40px; text-align: center; max-width: 800px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
               <div style="font-family: 'Arial Black', Impact, sans-serif; font-size: 80px; line-height: 1; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px;">Quantum <span style="color: var(--primary, #4ade80);">V4</span></div>
               <p style="color: rgba(255,255,255,0.7); font-size: 20px; margin: 0; max-width: 80%;">The best premium unblocked gaming website for any occasion.</p>
               
               <div style="display: flex; gap: 15px; margin-top: 25px; width: 100%; justify-content: center; flex-wrap: wrap;">
                 <a href="games.html" class="s-btn accent" style="padding: 16px 36px; font-size: 16px; border-radius: 12px; font-weight: bold; letter-spacing: 1px; text-decoration: none;">BROWSE 350+ GAMES</a>
                 <a href="apps.html" class="s-btn" style="padding: 16px 36px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; font-size: 16px; font-weight: bold; letter-spacing: 1px; text-decoration: none; color: white;">WEB APPS</a>
                 <a href="https://discord.gg/7MjQzEHfd8" target="_blank" class="s-btn" style="padding: 16px 36px; background: rgba(88, 101, 242, 0.15); border: 1px solid rgba(88, 101, 242, 0.4); border-radius: 12px; font-size: 16px; font-weight: bold; letter-spacing: 1px; text-decoration: none; color: white;">JOIN DISCORD</a>
               </div>
               
               <div style="margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-size: 15px; font-style: italic; color: rgba(255,255,255,0.6); width: 100%;">
                 <span id="quote"></span>
               </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    const quotes = [
      '"Join the discord for more links!',
      '"The Best unblocked site for anywhere',
      '"Premium unblocked games, movies, shows, and apps!',
      '"Say a thx to the Quantum Team!',
      '"Thx for choosing Quantum!'
    ];
    document.getElementById('quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

    (function () {
      const p = new URLSearchParams(location.search);
      if (p.get('fail') !== 'true') return;
      const from = p.get('from') || 'primary';
      const time = p.get('time') ? new Date(p.get('time')).toLocaleString() : '';
      const reason = p.get('reason') || 'unreachable';
      const banner = document.getElementById('failoverBannerIndex');
      if (banner) {
        banner.innerHTML = `<div><strong>Notice:</strong> Previous site (${from}) is down (${reason}). Switched to this site. <small>As of ${time}</small></div>`;
        banner.style.display = 'block';
        document.body.style.paddingTop = '56px';
      }
    })();
  </script>
</body>

</html>
