<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eclipse Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>

  <canvas id="bgCanvas"></canvas>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1>QUANTUM <span>V4</span></h1>
      </header>
      
      <div class="quantum-body">
        <aside class="sidebar">
          <!-- Injected by main.js -->
        </aside>
        
        <main class="quantum-panel">
          <div class="main-content">
            <div class="hero-glow a"></div>
            <div class="hero-glow b"></div>

            <div class="hero-content">
              <div class="hero-eyebrow">Quantum · best unblocked games</div>
              <h1 class="no-animation" style="font-size: 48px; margin-bottom: 10px;">Welcome Back.</h1>
              <p class="hero-subtitle">Premium unblocked games for maximum enjoyment.</p>

              <div class="hero-badges"><div class="badge-chip">200+ Games</div></div>
              <div class="hero-actions">
                <a href="games.html" class="btn primary">Browse Games</a>
                <a href="https://discord.gg/7MjQzEHfd8" target="_blank" class="btn discord">Join Discord</a>
              </div>
              <a href="https://forms.gle/Lt5JrEKaJJa5RNPi7" target="_blank" class="btn sheets">
                Request a Game
                <span class="btn-floating-icon">
                  <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM13 9V3.5L18.5 9H13z" />
                  </svg>
                </span>
              </a>

              <!-- Quote -->
              <div class="quote-section" style="margin-top: 40px;">
                <p id="quote"></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    const quotes = [
      '"The only way to do great work is to love what you do." — Steve Jobs',
      '"Life is what happens when you\'re busy making other plans." — John Lennon',
      '"Believe you can and you\'re halfway there." — Theodore Roosevelt',
      '"Dreams don\'t work unless you do." — John C. Maxwell',
      '"U lowky look mad cute rn ;D" — zomo :3'
    ];
    document.getElementById('quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

    (function () {
      const p = new URLSearchParams(location.search);
      if (p.get('fail') !== 'true') return;
      const from = p.get('from') || 'primary';
      const time = p.get('time') ? new Date(p.get('time')).toLocaleString() : '';
      const reason = p.get('reason') || 'unreachable';
      const banner = document.getElementById('failoverBannerIndex');
      if (banner) {
        banner.innerHTML = `<div><strong>Notice:</strong> Previous site (${from}) is down (${reason}). Switched to this site. <small>As of ${time}</small></div>`;
        banner.style.display = 'block';
        document.body.style.paddingTop = '56px';
      }
    })();
  </script>
</body>

</html>
