<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Games — Eclipse Games</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1><span>V4</span> QUANTUM</h1>
      </header>
      <div class="quantum-body">
        <aside class="sidebar"></aside>
        <main class="quantum-panel">
          <div class="games-container main-content">
    <div class="games-title-corner"><h1>Games</h1></div>
    <div class="games-controls">
      <div class="loader" id="loader"></div>
      <div class="loading-text" id="loadingText">Loading games...</div>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
    </div>
    <div class="games-panel">
      <section class="games-grid" id="gamesGrid" aria-live="polite"></section>
    </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Game Panel Overlay -->
  <div class="game-panel-overlay" id="gamePanelOverlay"></div>
  <div class="game-panel" id="gamePanel">
    <div class="game-panel-content">
      <div class="game-panel-loader" id="gamePanelLoader">
        <div class="loader" style="border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ffffff;"></div>
        <div style="color: #ffffff; font-size: 14px; margin-top: 16px;">Loading game...</div>
      </div>
      <iframe id="gameFrame" src=""
        allow="autoplay *; fullscreen *; accelerometer *; camera *; gyroscope *; magnetometer *; microphone *; usb *; xr-spatial-tracking *"></iframe>
    </div>
    <div class="game-panel-header">
      <h2 class="game-panel-title" id="gamePanelTitle">Game</h2>
      <div class="game-actions">
        <button class="game-panel-fullscreen" id="gamePanelFullscreen" title="Toggle Fullscreen">⛶</button>
        <button class="game-panel-close" id="gamePanelClose" title="Close">&times;</button>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function prettify(name) {
      const s = name.replace(/\/+$/, '').replace(/[-_]/g, ' ');
      return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    async function loadGames(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const loader = document.getElementById('loader');
      const loadingText = document.getElementById('loadingText');

      // Clear existing cards
      grid.innerHTML = '';
      loader.style.display = 'block';
      loadingText.style.display = 'block';

      // Simulate loading delay for visual effect
      setTimeout(async () => {
        loader.style.display = 'none';
        loadingText.style.display = 'none';

        // Get games to load based on quality mode
        let gamesToLoad = games;
        if (settings.lowQuality) {
          gamesToLoad = games.slice(0, 50);
        }

        let displayedCount = 0;
        for (const g of gamesToLoad) {
          if (!g || g === '.DS_Store') continue;
          const clean = g.replace(/\/+$/, '');
          const displayName = prettify(clean.replace('.html', ''));

          if (filter && !displayName.toLowerCase().includes(filter.toLowerCase())) {
            continue;
          }

          const href = (clean.endsWith('.html')) ? `assets/games/${clean}` : `assets/games/${clean}/index.html`;

          const a = document.createElement('a');
          a.className = 'card';
          a.style.backgroundImage = `url('${await resolveImagePath(clean, 'game')}')`;
          a.style.cursor = 'pointer';

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = displayName;

          a.appendChild(title);

          a.addEventListener('click', (e) => {
            e.preventDefault();
            openGamePanel(displayName, href);
          });

          grid.appendChild(a);
          displayedCount++;
        }

        if (displayedCount === 0 && filter) {
          const noResults = document.createElement('div');
          noResults.style.cssText = 'grid-column: 1 / -1; text-align: center; color: #cccccc; padding: 40px;';
          noResults.textContent = 'No games found matching "' + filter + '"';
          grid.appendChild(noResults);
        }
      }, 400);
    }

    function openGamePanel(gameName, gameUrl) {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const title = document.getElementById('gamePanelTitle');
      const frame = document.getElementById('gameFrame');
      const loader = document.getElementById('gamePanelLoader');

      title.textContent = gameName;
      loader.classList.remove('hidden');
      frame.src = gameUrl;

      frame.onload = function () {
        setTimeout(() => {
          loader.classList.add('hidden');
        }, 300);
      };

      panel.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeGamePanel() {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const frame = document.getElementById('gameFrame');

      panel.classList.remove('active');
      overlay.classList.remove('active');
      frame.src = '';
      document.body.style.overflow = 'auto';
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      loadGames(e.target.value);
    });

    const gamePanelClose = document.getElementById('gamePanelClose');
    const gamePanelOverlay = document.getElementById('gamePanelOverlay');
    const gamePanelFullscreen = document.getElementById('gamePanelFullscreen');
    const gameFrameElem = document.getElementById('gameFrame');

    gamePanelClose.addEventListener('click', closeGamePanel);
    gamePanelOverlay.addEventListener('click', closeGamePanel);

    if (gamePanelFullscreen) {
      gamePanelFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          if (gameFrameElem.requestFullscreen) gameFrameElem.requestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeGamePanel();
    });

    loadGames();
  </script>
</body>

</html>
