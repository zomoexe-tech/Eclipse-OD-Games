    function prettify(name) {
      const s = name.replace(/\/+$/, '').replace(/[-_]/g, ' ');
      return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function getImagePath(gameName) {
      // Convert game name to image filename (lowercase, no special chars)
      const clean = gameName.replace(/\/+$/, '').replace('.html', '');
      const imageName = clean.toLowerCase().replace(/[-_]/g, '');
      return `assets/gameimages/${imageName}.png`;
    }

    function loadGames(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const loader = document.getElementById('loader');
      const loadingText = document.getElementById('loadingText');

      // Simulate loading delay for visual effect
      setTimeout(() => {
        loader.style.display = 'none';
        loadingText.style.display = 'none';

        // Clear existing cards
        grid.innerHTML = '';

        // Get games to load based on quality mode
        let gamesToLoad = games;
        if (settings.lowQuality) {
          gamesToLoad = games.slice(0, 50); // Load only first 50 games in low quality mode
        }

        let displayedCount = 0;
        for (const g of gamesToLoad) {
          if (!g || g === '.DS_Store') continue;
          const clean = g.replace(/\/+$/, '');
          const displayName = prettify(clean.replace('.html', ''));

          // Filter based on search
          if (filter && !displayName.toLowerCase().includes(filter.toLowerCase())) {
            continue;
          }

          const href = (clean.endsWith('.html')) ? `assets/games/${clean}` : `assets/games/${clean}/index.html`;

          const a = document.createElement('a');
          a.className = 'card';
          a.style.backgroundImage = `url('${getImagePath(clean)}')`;
          a.style.cursor = 'pointer';

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = displayName;

          a.appendChild(title);

          // Click handler to open game in panel
          a.addEventListener('click', (e) => {
            e.preventDefault();
            openGamePanel(displayName, href);
          });

          grid.appendChild(a);
          displayedCount++;
        }

        // Show "no results" message if no games match
        if (displayedCount === 0 && filter) {
          const noResults = document.createElement('div');
          noResults.style.cssText = 'grid-column: 1 / -1; text-align: center; color: #cccccc; padding: 40px;';
          noResults.textContent = 'No games found matching "' + filter + '"';
          grid.appendChild(noResults);
        }
      }, 600);
    }

    function openGamePanel(gameName, gameUrl) {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const title = document.getElementById('gamePanelTitle');
      const frame = document.getElementById('gameFrame');
      const loader = document.getElementById('gamePanelLoader');

      title.textContent = gameName;

      // Show loader
      loader.classList.remove('hidden');

      // Set iframe src
      frame.src = '';

      // Apply URL spoofer if enabled (client-side only)
      let finalUrl = gameUrl;
      if (settings.urlSpoof && settings.urlSpoof.trim()) {
        const spoof = settings.urlSpoof.toLowerCase().trim();

        // Handle about:blank
        if (spoof === 'about:blank') {
          finalUrl = 'about:blank';
        } else {
          // Create a simple loader page that references the spoof URL
          const spoofedPath = spoof.endsWith('/')
            ? spoof + gameUrl.split('/').pop()
            : spoof;

          // Create an HTML page that sets the referrer and loads the game
          const loaderHtml = `<!DOCTYPE html>
<html>
<head>
  <meta name="referrer" content="no-referrer">
  <style>body { margin: 0; padding: 0; }</style>
</head>
<body>
  <iframe id="gameFrame" src="${gameUrl}" style="width:100%;height:100%;border:none;" allow="autoplay *; fullscreen *; accelerometer *; camera *; gyroscope *; magnetometer *; microphone *; usb *; xr-spatial-tracking *"></iframe>
  <script>
    // Spoof URL reference
    window.location.href = '${spoofedPath}#${btoa(gameUrl)}';
  <\/script>
</body>
</html>`;

          const blob = new Blob([loaderHtml], { type: 'text/html' });
          finalUrl = URL.createObjectURL(blob);
        }
      }

      frame.src = finalUrl;

      // Hide loader when iframe loads
      frame.onload = function () {
        setTimeout(() => {
          loader.classList.add('hidden');
        }, 300);
      };

      // Show panel
      panel.classList.add('active');
      overlay.classList.add('active');

      // Prevent body scroll when panel is open
      document.body.style.overflow = 'hidden';
    }

    function closeGamePanel() {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const frame = document.getElementById('gameFrame');

      panel.classList.remove('active');
      overlay.classList.remove('active');
      frame.src = '';

      // Restore body scroll
      document.body.style.overflow = 'auto';
    }

    loadGames();

  <script src="assets/js/main.js"></script>
  <script>
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', (e) => {
      loadGames(e.target.value);
    });

    const gamePanelClose = document.getElementById('gamePanelClose');
    const gamePanelOverlay = document.getElementById('gamePanelOverlay');
    const gamePanelFullscreen = document.getElementById('gamePanelFullscreen');
    const gameFrameElem = document.getElementById('gameFrame');

    gamePanelClose.addEventListener('click', closeGamePanel);
    gamePanelOverlay.addEventListener('click', closeGamePanel);

    if (gamePanelFullscreen) {
      gamePanelFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          if (gameFrameElem.requestFullscreen) gameFrameElem.requestFullscreen();
          else if (gameFrameElem.webkitRequestFullscreen) gameFrameElem.webkitRequestFullscreen();
          else if (gameFrameElem.msRequestFullscreen) gameFrameElem.msRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeGamePanel();
    });

    (function () {
      const p = new URLSearchParams(location.search);
      if (p.get('fail') === 'true') {
        const from = p.get('from') || 'primary';
        const time = p.get('time') ? new Date(p.get('time')).toLocaleString() : '';
        const reason = p.get('reason') || 'unreachable';
        const banner = document.getElementById('failoverBannerGames');
        if (banner) {
          banner.innerHTML = `<div><strong>Notice:</strong> Previous site (${from}) is down (${reason}). Switched to this site. <small>As of ${time}</small></div>`;
          banner.style.display = 'block';
          document.body.style.paddingTop = '56px';
        }
      }
    })();
