<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Games — Eclipse Games</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1>QUANTUM <span>V4</span></h1>
      </header>
      <div class="quantum-body">
        <aside class="sidebar"></aside>
        <main class="quantum-panel">
          <div class="games-container main-content">
    <div class="games-title-corner"><h1>Games</h1></div>
    <div class="games-controls">
      <div class="loader" id="loader"></div>
      <div class="loading-text" id="loadingText">Loading games...</div>
    </div>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
    </div>
    <div class="games-panel">
      <section class="games-grid" id="gamesGrid" aria-live="polite"></section>
    </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Game Panel Overlay -->
  <div class="game-panel-overlay" id="gamePanelOverlay"></div>
  <div class="game-panel" id="gamePanel">
    <!-- Top bar mirrors .quantum-header -->
    <div class="game-panel-topbar">
      <h2>QUANTUM <span>V4</span></h2>
    </div>
    <!-- Body: left controls + right iframe -->
    <div class="game-panel-body">
      <!-- Left control center -->
      <div class="game-control-panel">
        <div class="game-ctrl-logo">
          <div class="q-letter">Q</div>
          <div class="q-version" id="gamePanelTitle">Game</div>
        </div>
        <div class="game-ctrl-stats">
          <div class="stat-label">Stats</div>
          <div class="stat-values" id="panelFps">FPS | PING</div>
        </div>
        <button class="game-ctrl-btn" id="gamePanelClearCache" title="Reload">
          <span class="ctrl-icon">↺</span>
          <span class="ctrl-label">Clear Cache</span>
        </button>
        <button class="game-ctrl-btn" id="gamePanelFullscreen" title="Fullscreen">
          <span class="ctrl-icon">⛶</span>
          <span class="ctrl-label">Full Screen</span>
        </button>
        <button class="game-ctrl-btn exit-btn" id="gamePanelClose" title="Exit">
          <span class="ctrl-icon">✕</span>
          <span class="ctrl-label">Exit</span>
        </button>
      </div>
      <!-- Right: game content -->
      <div class="game-panel-content">
        <div class="game-panel-loader" id="gamePanelLoader">
          <div class="loader" style="border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ffffff;"></div>
          <div style="color:#fff; font-size:13px; margin-top:16px; font-family:'Arial Black',Impact; text-transform:uppercase; letter-spacing:2px;">Loading...</div>
        </div>
        <iframe id="gameFrame" src=""
          allow="autoplay *; fullscreen *; accelerometer *; camera *; gyroscope *; magnetometer *; microphone *; usb *; xr-spatial-tracking *"></iframe>
      </div>
    </div>
  </div>


  <script src="assets/js/interstellar-games.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function prettify(name) {
      const s = name.replace(/\/+$/, '').replace(/[-_]/g, ' ');
      return s.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    // Build a unified list of all game entries sorted alphabetically
    function buildAllGames() {
      // Local games (from main.js `games` array)
      const localEntries = games
        .filter(g => g && g !== '.DS_Store')
        .map(g => {
          const clean = g.replace(/\/+$/, '');
          const name = prettify(clean.replace('.html', ''));
          const href = clean.endsWith('.html') ? `assets/games/${clean}` : `assets/games/${clean}/index.html`;
          const cleanKey = clean.replace(/-/g,'').replace(/_/g,'').toLowerCase();
          const extMap = {
            'agesofconflict':'.jpg','basketbrosio':'.jpg','buildnowgg':'.webp',
            'burnoutextremedrift':'.jpeg','cuttherope':'.jpg','flappybird':'.webp',
            'karlson':'.webp','mario64':'.jpg','paperio':'.jpg',
            'subwaysurfers':'.jpg','superautopets':'.jpg','superhot':'.jpg',
            'motox3m':'.jpg','motox3m2':'.jpg','motox3mpoolparty':'.jpg',
            'motox3mspooky':'.jpg','motox3mwinter':'.jpg','newyork':'.jpeg',
            'minecraft112':'.jpg','sanfrancisco':'.jpeg','deathbyai':'.jpeg'
          };
          const ext = extMap[cleanKey] || '.png';
          return { name, href, icon: `assets/gameimages/${cleanKey}${ext}`, source: 'local' };
        });

      // Interstellar URL games
      const interstellarEntries = typeof interstellarGames !== 'undefined'
        ? interstellarGames.map(g => ({ name: g.name, href: g.url, icon: g.icon, source: 'external' }))
        : [];

      // Deduplicate by name (prefer local if dupe exists)
      const localNames = new Set(localEntries.map(g => g.name.toLowerCase()));
      const filteredInterstellar = interstellarEntries.filter(g => !localNames.has(g.name.toLowerCase()));

      return [...localEntries, ...filteredInterstellar].sort((a, b) => a.name.localeCompare(b.name));
    }

    let allGames = [];

    function loadGames(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const loader = document.getElementById('loader');
      const loadingText = document.getElementById('loadingText');

      grid.innerHTML = '';
      loader.style.display = 'block';
      loadingText.style.display = 'block';

      setTimeout(() => {
        loader.style.display = 'none';
        loadingText.style.display = 'none';

        let list = allGames;
        if (settings.lowQuality) list = list.slice(0, 80);

        let count = 0;
        for (const g of list) {
          if (filter && !g.name.toLowerCase().includes(filter.toLowerCase())) continue;

          const a = document.createElement('a');
          a.className = 'card';
          a.style.backgroundImage = `url('${g.icon}')`;
          a.style.cursor = 'pointer';

          // fallback image for broken icons
          const testImg = new Image();
          testImg.onerror = () => { a.style.backgroundImage = `url('assets/gameimages/${g.name.toLowerCase().replace(/[^a-z0-9]/g,'')}.png'), url('assets/appicons/na.webp')`; };
          testImg.src = g.icon;

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = g.name;
          a.appendChild(title);

          a.addEventListener('click', e => {
            e.preventDefault();
            openGamePanel(g.name, g.href);
          });

          grid.appendChild(a);
          count++;
        }

        if (count === 0 && filter) {
          const noResults = document.createElement('div');
          noResults.style.cssText = 'grid-column: 1 / -1; text-align: center; color: #cccccc; padding: 40px; font-family: Arial; font-size: 16px;';
          noResults.textContent = 'No games found matching "' + filter + '"';
          grid.appendChild(noResults);
        }
      }, 300);
    }

    function openGamePanel(gameName, gameUrl) {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const title = document.getElementById('gamePanelTitle');
      const frame = document.getElementById('gameFrame');
      const loader = document.getElementById('gamePanelLoader');

      title.textContent = gameName;
      loader.classList.remove('hidden');
      frame.src = gameUrl;

      frame.onload = () => {
        setTimeout(() => { loader.classList.add('hidden'); }, 300);
      };

      const fpsElem = document.getElementById('panelFps');
      if(fpsElem) {
        clearInterval(window.fpsInterval);
        fpsElem.innerText = '60 FPS | 24 MS';
        window.fpsInterval = setInterval(() => {
            const fps = Math.floor(Math.random() * (62 - 58 + 1)) + 58;
            const ping = Math.floor(Math.random() * (35 - 15 + 1)) + 15;
            fpsElem.innerText = `${fps} FPS | ${ping} MS`;
        }, 1500);
      }

      panel.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeGamePanel() {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const frame = document.getElementById('gameFrame');

      panel.classList.remove('active');
      overlay.classList.remove('active');
      frame.src = '';
      document.body.style.overflow = 'auto';
      clearInterval(window.fpsInterval);
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', e => loadGames(e.target.value));

    document.getElementById('gamePanelClose').addEventListener('click', closeGamePanel);
    document.getElementById('gamePanelOverlay').addEventListener('click', closeGamePanel);

    const gamePanelFullscreen = document.getElementById('gamePanelFullscreen');
    const gameFrameElem = document.getElementById('gameFrame');
    if (gamePanelFullscreen) {
      gamePanelFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          if (gameFrameElem.requestFullscreen) gameFrameElem.requestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGamePanel(); });

    document.getElementById('gamePanelClearCache')?.addEventListener('click', () => {
      const frame = document.getElementById('gameFrame');
      if(frame && frame.src) {
        const loader = document.getElementById('gamePanelLoader');
        loader.classList.remove('hidden');
        frame.src = frame.src;
      }
    });

    // Build and load once DOM+scripts are ready
    allGames = buildAllGames();
    loadGames();
  </script>
</body>

</html>
