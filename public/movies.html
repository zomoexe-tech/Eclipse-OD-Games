<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eclipse Movies</title>
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/movies.js"></script>
  <script>
    // Popup Blocker & Anti-Redirect Injection
    (function () {
      const originalOpen = window.open;
      window.open = function (url, name, specs) {
        console.warn('Blocked popup attempt to:', url);
        return {
          closed: true,
          close: function () { },
          focus: function () { },
          blur: function () { },
          postMessage: function () { }
        };
      };

      // Prevent top-level redirects from iframes
      window.onbeforeunload = function () {
        // If the redirect is not from a user-initiated internal link, we could warn
        // But for a cleaner experience, let's just log and rely on the sandbox attribute.
      };
    })();
  </script>
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1><span>V4</span> QUANTUM</h1>
      </header>
      <div class="quantum-body">
        <aside class="sidebar"></aside>
        <main class="quantum-panel">
          <div class="games-container main-content">
    <div class="games-title-corner">
      <h1>Movies</h1>
    </div>

    <div class="games-controls">
      <div class="loader" id="loader"></div>
      <div class="loading-text" id="loadingText">Loading movies...</div>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search movies...">
    </div>

    <div class="games-panel">
      <section class="games-grid" id="gamesGrid" aria-live="polite"></section>
    </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Panel Overlay -->
  <div class="game-panel-overlay" id="gamePanelOverlay"></div>
  <div class="game-panel" id="gamePanel">
    <div class="game-panel-content">
      <div class="game-panel-loader" id="gamePanelLoader">
        <div class="loader" style="border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ffffff;"></div>
        <div style="color: #ffffff; font-size: 14px; margin-top: 16px;">Loading movie...</div>
      </div>
      <iframe id="gameFrame" src=""
        sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin"
        allow="autoplay *; fullscreen *; accelerometer *; camera *; gyroscope *; magnetometer *; microphone *; usb *; xr-spatial-tracking *"></iframe>
      <video id="gameVideo" controls style="display: none; width: 100%; height: 100%; max-height: 80vh; border: none; border-radius: 8px; background: #000; outline: none;"></video>
    </div>
    <div class="game-panel-header">
      <h2 class="game-panel-title" id="gamePanelTitle">Movie</h2>
      <div class="game-actions">
        <button class="game-panel-fullscreen" id="gamePanelFullscreen" title="Toggle Fullscreen">⛶</button>
        <button class="game-panel-close" id="gamePanelClose" title="Close">&times;</button>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/movies.js"></script>
  <script>
    movies.sort((a, b) => a.title.localeCompare(b.title));

    function loadMovies(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const loader = document.getElementById('loader');
      const loadingText = document.getElementById('loadingText');

      grid.innerHTML = '';
      loader.style.display = 'block';
      loadingText.style.display = 'block';

      setTimeout(() => {
        loader.style.display = 'none';
        loadingText.style.display = 'none';

        let displayedCount = 0;
        for (const m of movies) {
          if (filter && !m.title.toLowerCase().includes(filter.toLowerCase())) {
            continue;
          }

          const a = document.createElement('a');
          a.className = 'card';
          
          // Improved poster loading to handle ORB/CORS blocking and naming
          if (m.poster && m.poster.includes('tmdb.org')) {
             // TMDB posters often need a size prefix if not provided
             const posterPath = m.poster.includes('/t/p/') ? m.poster : `https://image.tmdb.org/t/p/w500${m.poster}`;
             const fallbackPoster = `https://via.placeholder.com/500x750/111/fff?text=${encodeURIComponent(m.title)}`;
             a.style.backgroundImage = `url('${posterPath}'), url('${fallbackPoster}')`;
          } else {
             const localPoster = m.poster || 'assets/movieimages/default.png';
             a.style.backgroundImage = `url('${localPoster}'), url('https://via.placeholder.com/500x750/111/fff?text=${encodeURIComponent(m.title)}')`;
          }
          
          a.style.cursor = 'pointer';

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = m.title;

          a.appendChild(title);

          if (m.tags && m.tags.length > 0) {
            const tagsCont = document.createElement('div');
            tagsCont.className = 'tags-container';
            m.tags.slice(0, 2).forEach(tag => {
              const span = document.createElement('span');
              span.className = 'movie-tag';
              span.textContent = tag;
              tagsCont.appendChild(span);
            });
            a.appendChild(tagsCont);
          }

          a.addEventListener('click', (e) => {
            e.preventDefault();
            openMoviePanel(m.title, m.url);
          });

          grid.appendChild(a);
          displayedCount++;
        }

        if (displayedCount === 0 && filter) {
          const noResults = document.createElement('div');
          noResults.style.cssText = 'grid-column: 1 / -1; text-align: center; color: #cccccc; padding: 40px;';
          noResults.textContent = 'No movies found matching "' + filter + '"';
          grid.appendChild(noResults);
        }
      }, 400);
    }

    function openMoviePanel(name, url) {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const title = document.getElementById('gamePanelTitle');
      const frame = document.getElementById('gameFrame');
      const video = document.getElementById('gameVideo');
      const loader = document.getElementById('gamePanelLoader');

      title.textContent = name;
      loader.classList.remove('hidden');

      if (url.endsWith('.mp4') || url.endsWith('.webm')) {
        frame.style.display = 'none';
        video.style.display = 'block';
        video.src = url;
        video.onloadeddata = () => loader.classList.add('hidden');
        video.play().catch(e => console.log("Autoplay blocked"));
      } else {
        video.style.display = 'none';
        frame.style.display = 'block';
        frame.src = url;
        frame.onload = () => loader.classList.add('hidden');
      }

      panel.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeMoviePanel() {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const frame = document.getElementById('gameFrame');
      const video = document.getElementById('gameVideo');

      panel.classList.remove('active');
      overlay.classList.remove('active');
      frame.src = '';
      if (video) {
        video.pause();
        video.src = '';
      }
      document.body.style.overflow = 'auto';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      loadMovies(e.target.value);
    });

    document.getElementById('gamePanelClose').addEventListener('click', closeMoviePanel);
    document.getElementById('gamePanelOverlay').addEventListener('click', closeMoviePanel);

    document.getElementById('gamePanelFullscreen').addEventListener('click', () => {
      const v = document.getElementById('gameVideo');
      const target = (v && v.style.display === 'block') ? v : document.getElementById('gameFrame');
      if (!document.fullscreenElement) target.requestFullscreen();
      else document.exitFullscreen();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMoviePanel();
    });

    loadMovies();
  </script>
  </script>

</body>

</html>
