<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Eclipse Shows</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <!-- Failover banner placeholder (shown when redirected from manager) -->
  <div id="failoverBannerGames" class="failover-banner" style="display:none;"></div>

  <div class="quantum-wrapper">
    <div class="quantum-window">
      <header class="quantum-header">
        <h1>QUANTUM <span>V4</span></h1>
      </header>
      <div class="quantum-body">
        <aside class="sidebar"></aside>
        <main class="quantum-panel">
          <div class="games-container main-content">
    <div class="games-title-corner">
      <h1>Eclipse Shows</h1>
    </div>

    <div class="games-controls">
      <div class="loader" id="loader"></div>
      <div class="loading-text" id="loadingText">Loading shows...</div>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search shows...">
    </div>

    <div
      style="text-align: center; color: #ffeb3b; margin: 10px 0 20px 0; font-size: 14px; background: rgba(255, 235, 59, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 235, 59, 0.2);">
      <strong>Notice:</strong> Not all shows are complete in highest quality. These episodes might have watermarks to
      prevent being taken down.
    </div>

    <div class="games-panel">
      <section class="games-grid" id="gamesGrid" aria-live="polite"></section>
          </div>
        </main>
      </div>
    </div>
  </div>

  <!-- Panel Overlay -->
  <div class="game-panel-overlay" id="gamePanelOverlay"></div>
  <div class="game-panel" id="gamePanel">
    <!-- Top bar -->
    <div class="game-panel-topbar">
      <h2>QUANTUM <span>V4</span></h2>
    </div>
    <!-- Body: left controls + right iframe -->
    <div class="game-panel-body">
      <!-- Left control center -->
      <div class="game-control-panel">
        <div class="game-ctrl-logo">
          <div class="q-letter">Q</div>
          <div class="q-version" id="gamePanelTitle">Show</div>
        </div>
        <div class="game-ctrl-stats">
          <div class="stat-label">Stats</div>
          <div class="stat-values" id="panelFps">FPS | PING</div>
        </div>
        <button class="game-ctrl-btn" id="gamePanelClearCache" title="Reload">
          <span class="ctrl-icon">↺</span>
          <span class="ctrl-label">Clear Cache</span>
        </button>
        <button class="game-ctrl-btn" id="gamePanelFullscreen" title="Fullscreen">
          <span class="ctrl-icon">⛶</span>
          <span class="ctrl-label">Full Screen</span>
        </button>
        <button class="game-ctrl-btn exit-btn" id="gamePanelClose" title="Exit">
          <span class="ctrl-icon">✕</span>
          <span class="ctrl-label">Exit</span>
        </button>
      </div>
      <!-- Right: video/iframe content -->
      <div class="game-panel-content">
        <div class="game-panel-loader" id="gamePanelLoader">
          <div class="loader" style="border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ffffff;"></div>
          <div style="color: #ffffff; font-size: 14px; margin-top: 16px; font-family:'Arial Black',Impact; text-transform:uppercase; letter-spacing:2px;">Loading...</div>
        </div>
        <iframe id="gameFrame" src=""
          sandbox="allow-forms allow-scripts allow-pointer-lock allow-same-origin"
          allow="autoplay *; fullscreen *; accelerometer *; camera *; gyroscope *; magnetometer *; microphone *; usb *; xr-spatial-tracking *"></iframe>
        <video id="gameVideo" controls style="display: none; width: 100%; height: 100%; border: none; border-radius: 10px; background: #000; outline: none;"></video>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    // List of shows - manually curated
    const shows = [
      // Format example:
      // {
      //   title: "Show Title",
      //   poster: "https://url-to-poster.jpg",
      //   url: "https://vidlink.pro/tv/..."
      // }
    ];

    // Alphabetize the array just in case more items are added out of order
    shows.sort((a, b) => a.title.localeCompare(b.title));

    function loadGames(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const loader = document.getElementById('loader');
      const loadingText = document.getElementById('loadingText');

      // Simulate loading delay for visual effect
      setTimeout(() => {
        loader.style.display = 'none';
        loadingText.style.display = 'none';

        // Clear existing cards
        grid.innerHTML = '';

        let displayedCount = 0;
        for (const s of shows) {
          // Filter based on search
          if (filter && !s.title.toLowerCase().includes(filter.toLowerCase())) {
            continue;
          }

          const a = document.createElement('a');
          a.className = 'card';
          a.style.backgroundImage = `url('${s.poster}')`;
          a.style.cursor = 'pointer';

          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = s.title;
          title.style.textShadow = "-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000";

          a.appendChild(title);

          // Click handler to open game in panel
          a.addEventListener('click', (e) => {
            e.preventDefault();
            openGamePanel(s.title, s.url);
          });

          grid.appendChild(a);
          displayedCount++;
        }

        // Show "no results" message if no shows match
        if (displayedCount === 0 && filter) {
          const noResults = document.createElement('div');
          noResults.style.cssText = 'grid-column: 1 / -1; text-align: center; color: #cccccc; padding: 40px;';
          noResults.textContent = 'No shows found matching "' + filter + '"';
          grid.appendChild(noResults);
        } else if (displayedCount === 0) {
          // If no shows configured yet
          const noResults = document.createElement('div');
          noResults.style.cssText = 'grid-column: 1 / -1; text-align: center; color: #cccccc; padding: 40px;';
          noResults.textContent = 'More shows coming soon!';
          grid.appendChild(noResults);
        }
      }, 600);
    }

    function openGamePanel(gameName, gameUrl) {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const title = document.getElementById('gamePanelTitle');
      const frame = document.getElementById('gameFrame');
      const loader = document.getElementById('gamePanelLoader');

      title.textContent = gameName;

      // Show loader
      loader.classList.remove('hidden');

      // Set iframe src
      frame.src = gameUrl;

      // Hide loader when iframe loads
      frame.onload = function () {
        setTimeout(() => {
          loader.classList.add('hidden');
        }, 300);
      };

      // Listen for progress updates from VidLink player
      window.addEventListener('message', (event) => {
        if (event.origin !== 'https://vidlink.pro') return;
        if (event.data?.type === 'MEDIA_DATA' || event.data?.currentTime) {
          localStorage.setItem(gameName + 'Progress', JSON.stringify({
            currentTime: event.data.currentTime || event.data.data?.currentTime,
            duration: event.data.duration || event.data.data?.duration
          }));
        }
      });

      // Load saved progress if exists
      const saved = localStorage.getItem(gameName + 'Progress');
      if (saved) {
        const data = JSON.parse(saved);
        if (data.currentTime) {
          frame.src += (frame.src.includes('?') ? '&' : '?') + 'startAt=' + Math.floor(data.currentTime);
        }
      }

      // Show panel
      panel.classList.add('active');
      overlay.classList.add('active');

      // Prevent body scroll when panel is open
      document.body.style.overflow = 'hidden';
    }

    function closeGamePanel() {
      const panel = document.getElementById('gamePanel');
      const overlay = document.getElementById('gamePanelOverlay');
      const frame = document.getElementById('gameFrame');

      panel.classList.remove('active');
      overlay.classList.remove('active');
      frame.src = '';

      // Restore body scroll
      document.body.style.overflow = 'auto';
    }

    loadGames();

    // Settings and particles are now handled by main.js

    // Failover banner display when redirected from failover manager
    (function () {
      function showFailoverBannerIfNeeded() {
        const p = new URLSearchParams(location.search);
        if (p.get('fail') === 'true') {
          const from = p.get('from') || 'primary';
          const time = p.get('time') ? new Date(p.get('time')).toLocaleString() : '';
          const reason = p.get('reason') || 'unreachable';
          const banner = document.getElementById('failoverBannerGames');
          if (!banner) return;
          banner.innerHTML = `<div><strong>Notice:</strong> Previous site (${from}) is down (${reason}). Switched to this site. <small>As of ${time}</small></div>`;
          banner.style.display = 'block';
          document.body.style.paddingTop = '56px';
        }
      }
      showFailoverBannerIfNeeded();
    })();
  </script>

</body>

</html>
